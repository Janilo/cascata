# Guarda de supply-chain: ignora versões publicadas há menos de 24h.
# Portado de bunfig.toml (bun conta em segundos; pnpm, em minutos).
minimumReleaseAge: 1440
# Cada entrada fura a guarda de 24h para um pacote — confirmar antes de adicionar.
minimumReleaseAgeExclude:
  - '@lovable.dev/vite-tanstack-config'
